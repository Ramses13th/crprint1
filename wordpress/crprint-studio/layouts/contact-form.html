<form class="form-panel contact-form-clean" id="contact-form"><p class="eyebrow">POVESTEȘTE-NE PE SCURT</p><h2>Ce vrei să realizăm?</h2><p data-contact-mode>Îți răspundem în timpul programului. Câmpurile marcate cu * sunt obligatorii.</p><div class="form-grid"><div class="field"><label for="name">Numele tău *</label><input id="name" name="name" autocomplete="name" required minlength="2" maxlength="100" placeholder="Cum te numești?"></div><div class="field"><label for="email">Adresa de email *</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="180" placeholder="La ce adresă îți răspundem?"></div><div class="field full"><label for="message">Ideea ta *</label><textarea id="message" name="message" required minlength="10" maxlength="5000" rows="5" placeholder="Vreau să printez o piesă… / Am un obiect de scanat…"></textarea><small>Dacă le știi, adaugă dimensiunile, cantitatea și termenul dorit.</small></div></div><details class="contact-optional"><summary>Mai multe detalii <span>opțional</span></summary><div class="form-grid"><div class="field"><label for="phone">Telefon</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div><div class="field"><label for="service">Serviciul care te interesează</label><select id="service" name="service"><option value="">Ajută-mă să aleg</option><option>Modelare 3D</option><option>Printare FDM</option><option>Printare SLA</option><option>Scanare 3D</option><option>FaceScan / BodyScan</option></select></div></div></details><div class="contact-form-end"><div class="field challenge-field"><label for="answer">Verificare anti-spam: <span data-human-question>se încarcă…</span> = ? *</label><input id="answer" name="answer" inputmode="numeric" type="number" required autocomplete="off" aria-describedby="challenge-help"><small id="challenge-help">Rezolvă calculul simplu înainte de trimitere.</small></div><div class="honeypot" aria-hidden="true"><label for="company-website">Site-ul companiei</label><input id="company-website" name="company_website" tabindex="-1" autocomplete="off"></div><label class="checkbox-label"><input type="checkbox" name="consent" required><span>Am citit <a href="confidentialitate.html">nota de confidențialitate</a> și accept folosirea datelor pentru răspunsul la solicitare. *</span></label><button class="button button-primary" type="submit">Trimite solicitarea <span aria-hidden="true">↗</span></button><p class="form-status" role="status" aria-live="polite"></p></div></form>
